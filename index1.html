<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阮明俊 - Maximalism Profile</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&family=Rubik+Mono+One&display=swap');

  :root {
    --color-bg: #FFFF00; /* 亮黃 */
    --color-accent1: #FF00FF; /* 螢光粉 */
    --color-accent2: #00FFFF; /* 螢光藍 */
    --color-text: #000000;
    --border-thick: 4px solid #000;
  }

  body {
    background-color: var(--color-bg);
    background-image: 
      linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000),
      linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
    font-family: 'Noto Sans TC', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
  }

  .card-container {
    background: #fff;
    width: 90%;
    max-width: 600px;
    border: var(--border-thick);
    box-shadow: 15px 15px 0px var(--color-accent1), -10px -10px 0px var(--color-accent2);
    padding: 2rem;
    position: relative;
    transform: rotate(-2deg);
    transition: transform 0.3s ease;
  }

  .card-container:hover {
    transform: rotate(0deg) scale(1.02);
  }

  h1 {
    font-family: 'Rubik Mono One', sans-serif;
    font-size: 3rem;
    line-height: 1;
    color: var(--color-text);
    text-transform: uppercase;
    text-shadow: 3px 3px 0px var(--color-accent2);
    margin: 0 0 1rem 0;
    background: var(--color-accent1);
    display: inline-block;
    padding: 5px 15px;
    border: var(--border-thick);
    transform: skewX(-10deg);
  }

  .profile-img-wrapper {
    position: relative;
    width: 100%;
    height: 300px;
    overflow: hidden;
    border: var(--border-thick);
    margin-bottom: 2rem;
    background-color: #000;
  }

  .profile-img-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: contrast(120%) saturation(120%);
    transition: filter 0.3s;
  }

  .profile-img-wrapper:hover img {
    filter: contrast(100%) grayscale(100%);
  }

  .badge-id {
    position: absolute;
    top: -15px;
    right: -15px;
    background: var(--color-accent2);
    color: #000;
    font-weight: 900;
    padding: 10px 20px;
    font-size: 1.5rem;
    border: var(--border-thick);
    transform: rotate(5deg);
    z-index: 10;
  }

  .info-section {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
    font-size: 1.2rem;
    font-weight: 700;
  }

  .info-box {
    background: #fff;
    border: var(--border-thick);
    padding: 15px;
    box-shadow: 5px 5px 0px #000;
  }

  .info-box.meta {
    background-color: #eee;
  }

  .info-box.interests {
    background-color: var(--color-accent2);
  }

  .info-box.experience {
    background-color: var(--color-bg);
  }

  .label {
    display: block;
    font-size: 0.8em;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
    opacity: 0.8;
  }

  .action-btn {
    display: block;
    width: 100%;
    background: #000;
    color: #fff;
    text-align: center;
    padding: 20px;
    margin-top: 2rem;
    font-size: 1.5rem;
    text-decoration: none;
    font-weight: 900;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .action-btn:hover {
    background: var(--color-accent1);
    color: #000;
  }

  .decorative-text {
    position: absolute;
    font-size: 10rem;
    opacity: 0.1;
    font-weight: 900;
    z-index: -1;
    white-space: nowrap;
    pointer-events: none;
  }

</style>
</head>
<body>

  <div class="decorative-text" style="top: 0; left: 0; color: red;">HELLO</div>
  <div class="decorative-text" style="bottom: 0; right: 0; color: blue;">TAIWAN</div>

  <article class="card-container">
    <div class="badge-id">BD1141009</div>
    
    <h1>阮明俊<br><span style="font-size: 0.6em; -webkit-text-stroke: 1px black; color: white;">Nguyen Minh Tuan</span></h1>

    <div class="profile-img-wrapper">
      <a href="https://drive.google.com/uc?id=1yB16SnoUeSWlA6v62T9qMg2C0u7boM6j" target="_blank">
        <img src="imagesnew/nguyen_minh_tuan.jpg" alt="阮明俊 Nguyen Minh Tuan">
      </a>
    </div>

    <div class="info-section">
      <div class="info-box meta">
        <span class="label">BASIC INFO / 基本資料</span>
        越南 ｜ 男 ｜ 2002/1/16
      </div>

      <div class="info-box interests">
        <span class="label">INTERESTS / 興趣</span>
        聽音樂、打羽球、游泳
      </div>

      <div class="info-box experience">
        <span class="label">MUST TRY / 想體驗</span>
        台灣奶茶、夜市小吃
      </div>
    </div>

    <a class="action-btn" href="https://drive.google.com/uc?id=1yB16SnoUeSWlA6v62T9qMg2C0u7boM6j" target="_blank">
      開啟 Drive 照片 ➔
    </a>
  </article>

</body>
</html>
